<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Kezek Scanner</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
:root {
  --bg: var(--tg-theme-bg-color, #0f0f0f);
  --text: var(--tg-theme-text-color, #ffffff);
  --hint: var(--tg-theme-hint-color, #8a8a8a);
  --button: var(--tg-theme-button-color, #2ea6ff);
  --button-text: var(--tg-theme-button-text-color, #ffffff);
  --secondary-bg: var(--tg-theme-secondary-bg-color, #1c1c1e);
}
* { box-sizing: border-box; margin:0; padding:0; -webkit-tap-highlight-color: transparent; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', Inter, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 16px;
}
.container { width: 100%; max-width: 420px; }
.header { text-align: center; padding: 12px 0 18px; }
.header h1 { font-size: 22px; font-weight: 700; }
.header p { font-size: 14px; color: var(--hint); margin-top: 6px; }
.card {
  background: var(--secondary-bg);
  border-radius: 16px;
  padding: 14px;
  margin-bottom: 14px;
  border: 1px solid rgba(255,255,255,0.08);
}
#reader {
  width: 100%;
  border-radius: 12px;
  overflow: hidden;
  background: #000;
  min-height: 260px;
  position: relative;
}
#reader video { border-radius: 12px; }
.controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
.btn {
  height: 48px;
  border: none;
  border-radius: 12px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  transition: opacity .15s, transform .1s;
}
.btn:active { transform: scale(0.97); }
.btn-primary { background: var(--button); color: var(--button-text); }
.btn-secondary { background: rgba(255,255,255,0.1); color: var(--text); }
.btn:disabled { opacity: .45; pointer-events: none; }
.btn-full { grid-column: 1 / -1; }
.status {
  margin-top: 12px;
  font-size: 13px;
  color: var(--hint);
  text-align: center;
  min-height: 18px;
}
.result {
  display: none;
  padding: 16px;
  text-align: center;
}
.result.show { display: block; }
.result .icon { font-size: 48px; margin-bottom: 10px; }
.result h2 { font-size: 18px; margin-bottom: 6px; }
.result .id-badge {
  display: inline-block;
  background: var(--button);
  color: var(--button-text);
  padding: 6px 14px;
  border-radius: 99px;
  font-weight: 700;
  font-size: 15px;
  margin: 10px 0;
}
.gallery-input { display: none; }
.debug { font-size: 11px; color: var(--hint); word-break: break-all; margin-top: 8px; opacity: .7; }
.link-section { margin-top: 12px; }
.link-row { display: flex; gap: 8px; }
.link-input {
  flex: 1;
  height: 48px;
  border-radius: 12px;
  border: 1px solid rgba(255,255,255,0.12);
  background: rgba(255,255,255,0.06);
  color: var(--text);
  padding: 0 14px;
  font-size: 14px;
  outline: none;
}
.link-input::placeholder { color: var(--hint); }
.link-input:focus { border-color: var(--button); }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>📷 Kezek Scanner</h1>
    <p>Наведи камеру на QR заведения</p>
  </div>

  <div class="card">
    <div id="reader"></div>
    <div class="status" id="status">Нажми "Запустить камеру"</div>
    
    <div class="controls">
      <button class="btn btn-primary" id="startBtn" onclick="startCamera()">▶️ Старт</button>
      <button class="btn btn-secondary" id="stopBtn" onclick="stopCamera()" disabled>⏹ Стоп</button>
      <button class="btn btn-secondary btn-full" id="galleryBtn" onclick="openGallery()">🖼 Галерея</button>
      <input type="file" id="galleryInput" class="gallery-input" accept="image/*" onchange="handleGalleryFile(this)">
    </div>

    <div class="link-section">
      <div class="link-row">
        <input type="text" id="linkInput" class="link-input" placeholder="Вставь ссылку: t.me/...est_123 или 123" onkeydown="if(event.key==='Enter') handleLinkInput()">
        <button class="btn btn-primary" style="width:56px; flex-shrink:0;" onclick="handleLinkInput()">➡️</button>
      </div>
    </div>
  </div>

  <div class="card result" id="resultBox">
    <div class="icon">✅</div>
    <h2>QR считан!</h2>
    <div class="id-badge" id="resultId">ID: ...</div>
    <div class="debug" id="resultRaw"></div>
    <div class="controls" style="margin-top:14px">
      <button class="btn btn-primary btn-full" id="goBtn" onclick="sendToBot()">⚡️ Перейти к записи</button>
      <button class="btn btn-secondary btn-full" onclick="resetScanner()">🔁 Сканировать еще</button>
    </div>
  </div>
</div>

<script>
const BOT_USERNAME = "kezek_service_bot"; // Юзернейм вашего бота без @

const tg = window.Telegram?.WebApp;
if (tg) {
  tg.ready();
  tg.expand();
  tg.enableClosingConfirmation();
}

let html5QrCode = null;
let lastDecoded = null;
let lastEstId = null;

function setStatus(text, isError=false) {
  const el = document.getElementById('status');
  el.textContent = text;
  el.style.color = isError ? '#ff4d4d' : 'var(--hint)';
}

function extractEstId(data) {
  if (!data) return null;
  data = String(data).trim();
  let m = data.match(/est_(\d+)/i);
  if (m) return parseInt(m[1], 10);
  m = data.match(/start(?:app)?=est_(\d+)/i);
  if (m) return parseInt(m[1], 10);
  if (/^\d+$/.test(data)) return parseInt(data, 10);
  m = data.match(/establishment[_-]?id[=:](\d+)/i);
  if (m) return parseInt(m[1], 10);
  try {
    const obj = JSON.parse(data);
    if (obj.est_id) return parseInt(obj.est_id,10);
    if (obj.establishment_id) return parseInt(obj.establishment_id,10);
    if (obj.qr_data) return extractEstId(obj.qr_data);
  } catch(e){}
  return null;
}

async function startCamera() {
  if (!html5QrCode) {
    html5QrCode = new Html5Qrcode("reader", { verbose: false });
  }
  setStatus("Запрашиваю доступ к камере...");
  try {
    const config = { fps: 10, qrbox: { width: 250, height: 250 }, aspectRatio: 1.0, experimentalFeatures: { useBarCodeDetectorIfSupported: true } };
    await html5QrCode.start(
      { facingMode: "environment" },
      config,
      onScanSuccess,
      (err) => {}
    );
    document.getElementById('startBtn').disabled = true;
    document.getElementById('stopBtn').disabled = false;
    setStatus("Наведи на QR...");
    if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
  } catch (err) {
    console.error(err);
    setStatus("Ошибка камеры: " + err.message, true);
  }
}

async function stopCamera() {
  if (html5QrCode && html5QrCode.isScanning) {
    try { await html5QrCode.stop(); } catch(e){}
  }
  document.getElementById('startBtn').disabled = false;
  document.getElementById('stopBtn').disabled = true;
  setStatus("Камера остановлена");
}

function openGallery() {
  document.getElementById('galleryInput').click();
}

async function handleGalleryFile(input) {
  if (!input.files || input.files.length === 0) return;
  const file = input.files[0];
  setStatus("Читаю фото...");
  if (!html5QrCode) html5QrCode = new Html5Qrcode("reader", { verbose: false });
  if (html5QrCode.isScanning) { try { await html5QrCode.stop(); } catch(e){} }
  try {
    const decoded = await html5QrCode.scanFile(file, true);
    onScanSuccess(decoded, null);
  } catch (err) {
    console.error(err);
    setStatus("QR на фото не найден. Попробуй другое фото.", true);
    if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
  }
  input.value = "";
}

function handleLinkInput() {
  const input = document.getElementById('linkInput');
  const val = input.value.trim();
  if (!val) {
    setStatus("Вставь ссылку или ID", true);
    return;
  }
  onScanSuccess(val, null);
}

function onScanSuccess(decodedText, decodedResult) {
  if (lastDecoded === decodedText) return;
  lastDecoded = decodedText;
  const estId = extractEstId(decodedText);
  const resultBox = document.getElementById('resultBox');
  const resultId = document.getElementById('resultId');
  const resultRaw = document.getElementById('resultRaw');
  
  // Принудительно скрываем старую Telegram MainButton, чтобы не было дубликатов
  if (tg?.MainButton) {
    tg.MainButton.hide();
  }

  if (!estId) {
    setStatus("ID заведения не найден в ссылке", true);
    resultRaw.textContent = decodedText.slice(0, 200);
    resultBox.classList.add('show');
    resultId.textContent = "❓ Неизвестный формат";
    lastEstId = null;
    if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('warning');
    return;
  }
  
  lastEstId = estId;
  resultId.textContent = `ID заведения: ${estId}`;
  resultRaw.textContent = decodedText.slice(0, 200);
  resultBox.classList.add('show');
  setStatus(`✅ Найдено заведение: #${estId}`);
  stopCamera();
  if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
}

function sendToBot() {
  const estId = lastEstId || extractEstId(lastDecoded);
  if (!estId) {
    setStatus("Сначала отсканируй QR или вставь ссылку", true);
    return;
  }

  const payload = JSON.stringify({ est_id: estId, qr_data: lastDecoded });
  let sent = false;

  // Пробуем отправить данные через встроенный sendData
  if (tg && tg.sendData) {
    try {
      tg.sendData(payload);
      sent = true;
    } catch (e) {
      console.warn("sendData error:", e);
    }
  }

  // Если sendData недоступен/ошибка, делаем переход через официальную ссылку бота с параметром start
  if (!sent) {
    const deepLink = `https://t.me/${BOT_USERNAME}?start=est_${estId}`;
    if (tg && tg.openTelegramLink) {
      tg.openTelegramLink(deepLink);
    } else {
      window.location.href = deepLink;
    }
  }

  // Закрываем Mini App
  if (tg && tg.close) {
    setTimeout(() => tg.close(), 200);
  }
}

function resetScanner() {
  lastDecoded = null;
  lastEstId = null;
  document.getElementById('resultBox').classList.remove('show');
  document.getElementById('linkInput').value = "";
  setStatus("Нажми Старт для нового скана");
  document.getElementById('startBtn').disabled = false;
}

window.addEventListener('load', () => {
  if (tg && tg.platform !== 'unknown') {
    setTimeout(startCamera, 400);
  }
});
</script>
</body>
</html>
