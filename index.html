<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kezek — Сканер</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      margin: 0;
      background: #000;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: sans-serif;
      font-size: 18px;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
    }
    .box { max-width: 400px; }
    #status { font-size: 20px; line-height: 1.4; margin-bottom: 24px; }
    button {
      padding: 16px 32px;
      font-size: 18px;
      background: #2ea6ff;
      color: #fff;
      border: none;
      border-radius: 12px;
      cursor: pointer;
    }
    button:active { opacity: 0.7; }
  </style>
</head>
<body>
  <div class="box">
    <div id="status">Открываем сканер…</div>
    <button id="retry" style="display:none" onclick="openScanner()">Сканировать ещё раз</button>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    function parseToken(text) {
      const marker = "start=est_";
      const idx = text.indexOf(marker);
      if (idx === -1) {
        return null;
      }
      let token = text.substring(idx + marker.length);
      const amp = token.indexOf("&");
      if (amp !== -1) {
        token = token.substring(0, amp);
      }
      const hash = token.indexOf("#");
      if (hash !== -1) {
        token = token.substring(0, hash);
      }
      if (token.length === 0) {
        return null;
      }
      return token;
    }

    function openScanner() {
      document.getElementById("retry").style.display = "none";
      document.getElementById("status").innerText = "Наведи камеру на QR Kezek";

      if (typeof tg.showScanQrPopup !== "function") {
        document.getElementById("status").innerText =
          "Сканер недоступен. Обнови Telegram до последней версии.";
        return;
      }

      tg.showScanQrPopup(
        { text: "Наведи на QR заведения" },
        (text) => {
          const token = parseToken(text);
          if (token === null) {
            tg.showAlert("Это не QR Kezek");
            return false;
          }
          tg.sendData(JSON.stringify({ est_token: token }));
          tg.close();
          return true;
        }
      );
    }

    tg.onEvent("scanQrPopupClosed", () => {
      document.getElementById("status").innerText = "Сканирование отменено";
      document.getElementById("retry").style.display = "inline-block";
    });

    setTimeout(openScanner, 300);
  </script>
</body>
</html>
