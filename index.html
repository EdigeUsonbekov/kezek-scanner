<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Сканер QR — Kezek</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0f172a; color: #e2e8f0;
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; padding: 16px;
  }
  h1 { font-size: 20px; margin-bottom: 8px; color: #fff; }
  .hint { font-size: 14px; color: #94a3b8; margin-bottom: 16px; text-align: center; }
  #reader {
    width: 100%; max-width: 360px; border-radius: 16px; overflow: hidden;
    background: #1e293b; border: 2px solid #334155;
  }
  #status {
    margin-top: 16px; font-size: 15px; text-align: center;
    padding: 12px 16px; border-radius: 12px; background: #1e293b;
    width: 100%; max-width: 360px; min-height: 48px;
    display: flex; align-items: center; justify-content: center;
  }
  #status.error { background: #7f1d1d; color: #fecaca; }
  #status.ok { background: #14532d; color: #bbf7d0; }
</style>
</head>
<body>
  <h1>📷 Сканер QR-кода</h1>
  <div class="hint">Наведите камеру на QR-код заведения</div>
  <div id="reader"></div>
  <div id="status">Запускаю камеру…</div>

<script>
  const tg = window.Telegram.WebApp;
  tg.ready();
  tg.expand();

  const statusEl = document.getElementById("status");
  function setStatus(text, cls) {
    statusEl.textContent = text;
    statusEl.className = cls || "";
  }

  function parseBusinessId(text) {
    if (!text) return null;
    const m = text.match(/[?&]start=(\d+)/);
    if (m) return m[1];
    const digits = text.trim();
    if (/^\d+$/.test(digits)) return digits;
    return null;
  }

  let stopped = false;

  const qr = new Html5Qrcode("reader", { verbose: false });

  function onScanSuccess(decodedText) {
    if (stopped) return;
    const id = parseBusinessId(decodedText);
    if (id) {
      stopped = true;
      setStatus("✅ QR распознан, ID: " + id, "ok");
      qr.stop().finally(() => {
        try {
          tg.sendData(JSON.stringify({ business_id: id }));
        } catch (e) {
          setStatus("Ошибка отправки: " + e, "error");
        }
        setTimeout(() => tg.close(), 300);
      });
    } else {
      setStatus("⚠️ Это не QR заведения. Попробуйте другой.", "error");
    }
  }

  qr.start(
    { facingMode: "environment" },
    { fps: 10, qrbox: { width: 260, height: 260 } },
    onScanSuccess,
    () => {}
  ).then(() => {
    setStatus("Камера активна. Наведите на QR.");
  }).catch(err => {
    setStatus("Не удалось открыть камеру: " + err, "error");
  });
</script>
</body>
</html>
