<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Сканер QR — Kezek</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0f172a; color: #e2e8f0;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; padding: 16px; text-align: center;
  }
  .box { max-width: 380px; width: 100%; }
  h1 { font-size: 20px; margin-bottom: 12px; }
  p { font-size: 15px; color: #94a3b8; margin-bottom: 10px; }
  code { background: #1e293b; padding: 2px 6px; border-radius: 4px; font-size: 14px; }
  input {
    width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #334155;
    background: #1e293b; color: #e2e8f0; font-size: 15px; margin: 8px 0;
  }
  button {
    width: 100%; padding: 12px; border-radius: 8px; border: none;
    background: #22c55e; color: white; font-size: 16px;
    cursor: pointer; font-weight: 600; margin-top: 8px;
  }
  button.secondary { background: #475569; }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="box">
  <div id="status">
    <h1>📷 Открываю камеру…</h1>
    <p>Наведите на QR-код заведения</p>
  </div>
  <div id="success" class="hidden">
    <h1>✅ QR распознан</h1>
    <p>Отправляю в чат…</p>
    <button class="secondary" onclick="sendAgain()">Отправить ещё раз</button>
  </div>
  <div id="manual" class="hidden">
    <h1>⌨️ Ввести вручную</h1>
    <p>Ссылка или ID заведения:</p>
    <input id="manualInput" type="text" placeholder="https://t.me/... или 1">
    <button onclick="sendManual()">Отправить</button>
  </div>
</div>
<script>
  const tg = window.Telegram.WebApp;
  tg.ready();
  tg.expand();

  let scannedBid = null;

  function parseBusinessId(text) {
    if (!text) return null;
    const m = String(text).match(/[?&]start=(\d+)/);
    if (m) return m[1];
    const s = String(text).trim();
    if (/^\d+$/.test(s)) return s;
    return null;
  }

  function showScreen(id) {
    ['status', 'success', 'manual'].forEach(function(s) {
      document.getElementById(s).classList.add('hidden');
    });
    document.getElementById(id).classList.remove('hidden');
  }

  function sendBid(bid) {
    try {
      tg.sendData(JSON.stringify({ business_id: bid }));
      return true;
    } catch (e) {
      return e.message || String(e);
    }
  }

  function sendAgain() {
    if (!scannedBid) return;
    const r = sendBid(scannedBid);
    if (r !== true) {
      document.getElementById('success').innerHTML =
        '<h1>⚠️ Ошибка</h1>' +
        '<p>Не удалось: ' + r + '</p>' +
        '<p>Пришлите ID вручную: <code>' + scannedBid + '</code></p>' +
        '<button onclick="showScreen(\'manual\')">Ввести вручную</button>';
    }
  }

  function sendManual() {
    const val = document.getElementById('manualInput').value.trim();
    const bid = parseBusinessId(val);
    if (!bid) {
      alert('Не нашёл ID. Проверьте ссылку или число.');
      return;
    }
    const r = sendBid(bid);
    if (r !== true) {
      alert('Ошибка отправки: ' + r);
    }
  }

  if (typeof tg.showScanQrPopup !== 'function') {
    showScreen('manual');
  } else {
    tg.showScanQrPopup(
      { text: "Наведите камеру на QR-код заведения" },
      function (data) {
        const bid = parseBusinessId(data);
        if (!bid) {
          return false;
        }
        scannedBid = bid;
        showScreen('success');
        setTimeout(function() {
          sendAgain();
        }, 350);
        return true;
      }
    );

    setTimeout(function() {
      if (!scannedBid) {
        showScreen('manual');
      }
    }, 15000);
  }
</script>
</body>
</html>
