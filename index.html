<script>
// ЗАМЕНИ ТОЛЬКО ФУНКЦИЮ startCamera НА ЭТУ В ТВОЕМ ФАЙЛЕ:

async function startCamera() {
  const tg = window.Telegram?.WebApp;

  // СПОСОБ 1: Родной сканер Telegram (работает 100% внутри бота)
  if (tg && tg.showScanQrPopup) {
    setStatus("Открываю сканер Telegram...");
    tg.showScanQrPopup(
      { text: "Наведи на QR заведения" },
      (text) => {
        tg.closeScanQrPopup();
        onScanSuccess(text);
        return true; // закрываем попап
      }
    );
    return;
  }

  // СПОСОБ 2: Fallback через камеру браузера (для теста вне Telegram)
  if (!html5QrCode) {
    html5QrCode = new Html5Qrcode("reader");
  }
  setStatus("Запрашиваю доступ к камере...");
  try {
    await html5QrCode.start(
      { facingMode: "environment" },
      { fps: 10, qrbox: { width: 250, height: 250 } },
      onScanSuccess,
      ()=>{}
    );
    document.getElementById('startBtn').disabled = true;
    document.getElementById('stopBtn').disabled = false;
    setStatus("Наведи на QR...");
  } catch (err) {
    setStatus("Ошибка камеры: " + err.message + " | Попробуй открыть через Telegram", true);
  }
}
</script>
