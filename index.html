<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Сканер QR — Kezek</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0f172a; color: #e2e8f0;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; margin: 0; padding: 16px;
    text-align: center;
  }
  .box { max-width: 360px; }
  h1 { font-size: 20px; margin-bottom: 12px; }
  p { font-size: 15px; color: #94a3b8; }
</style>
</head>
<body>
<div class="box">
  <h1>📷 Сканер QR</h1>
  <p>Открываю камеру Telegram…</p>
</div>
<script>
  const tg = window.Telegram.WebApp;
  tg.ready();
  tg.expand();

  function parseBusinessId(text) {
    if (!text) return null;
    const m = String(text).match(/[?&]start=(\d+)/);
    if (m) return m[1];
    const s = String(text).trim();
    if (/^\d+$/.test(s)) return s;
    return null;
  }

  function sendAndClose(bid) {
    try {
      tg.sendData(JSON.stringify({ business_id: bid }));
    } catch (e) {
      document.body.innerHTML =
        '<div class="box"><h1>⚠️ Ошибка</h1><p>' + e + '</p></div>';
    }
  }

  if (typeof tg.showScanQrPopup === 'function') {
    tg.showScanQrPopup(
      { text: "Наведите камеру на QR-код заведения" },
      function (data) {
        const bid = parseBusinessId(data);
        if (bid) {
          sendAndClose(bid);
          return true;
        }
        return false;
      }
    );
    tg.onEvent('scanQrPopupClosed', function () {
      document.querySelector('.box').innerHTML =
        '<h1>📷 Сканер закрыт</h1>' +
        '<p>Если QR не распознался — вернитесь в чат с ботом ' +
        'и пришлите ссылку или ID заведения вручную.</p>';
    });
  } else {
    document.querySelector('.box').innerHTML =
      '<h1>⚠️ Не поддерживается</h1>' +
      '<p>Обновите Telegram до последней версии ' +
      'или пришлите ссылку на заведение в чат с ботом.</p>';
  }
</script>
</body>
</html>
